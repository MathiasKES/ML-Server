[project]
name = "mlserverpy"
version = "0.1.0"
description = "Python client SDK for ML-Server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0"
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.7.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"