<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — GradInv</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0c10; --bg2: #111318; --bg3: #181b22;
      --border: #1e2330; --bord2: #2a3045;
      --text: #c8d0e0; --text3: #3d4560;
      --accent: #4af0a8; --acc2: #00b8ff; --r: 6px;
      --mono: 'Space Mono', monospace; --ui: 'Syne', sans-serif;
    }
    body {
      font-family: var(--ui); background: var(--bg); color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(74,240,168,.06), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,184,255,.04), transparent);
    }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { width: 100%; max-width: 380px; background: var(--bg2); border: 1px solid var(--bord2); border-radius: 10px; overflow: hidden; }
    .login-hd { padding: 32px 32px 24px; border-bottom: 1px solid var(--border); text-align: center; }
    .login-hd .mark { font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: var(--accent); text-transform: uppercase; }
    .login-hd h2 { font-size: 20px; font-weight: 800; margin-top: 6px; }
    .login-hd p  { font-size: 12px; color: var(--text3); margin-top: 4px; }
    .login-bd { padding: 28px 32px 32px; }
    .form-g { margin-bottom: 18px; }
    .form-lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 7px; }
    .form-inp { width: 100%; background: var(--bg3); border: 1px solid var(--bord2); border-radius: var(--r); padding: 10px 14px; font-size: 14px; color: var(--text); font-family: var(--mono); outline: none; transition: border-color .15s; }
    .form-inp:focus { border-color: var(--acc2); }
    .sub-btn { width: 100%; background: var(--accent); color: var(--bg); border: none; border-radius: var(--r); padding: 12px; font-size: 14px; font-weight: 700; font-family: var(--ui); cursor: pointer; transition: opacity .15s; }
    .sub-btn:hover { opacity: .85; }
    .err-msg { background: rgba(240,90,90,.12); border: 1px solid rgba(240,90,90,.3); border-radius: var(--r); padding: 10px 14px; font-size: 13px; color: #f05a5a; margin-bottom: 18px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-hd">
      <div class="mark">◈ GradInv</div>
      <h2>Sign In</h2>
      <p>Gradient Inversion Experiment Server</p>
    </div>
    <div class="login-bd">
      {% if error %}
        <div class="err-msg">Invalid credentials. Please try again.</div>
      {% endif %}
      <form action="/login" method="post">
        <div class="form-g">
          <label class="form-lbl">Username</label>
          <input class="form-inp" type="text" name="username" placeholder="username" autofocus autocomplete="username">
        </div>
        <div class="form-g">
          <label class="form-lbl">Password</label>
          <input class="form-inp" type="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="sub-btn" type="submit">Sign in →</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
