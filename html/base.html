<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GradInv{% endblock %} — GradInv</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0c10;
      --bg2:    #111318;
      --bg3:    #181b22;
      --border: #1e2330;
      --bord2:  #2a3045;
      --text:   #c8d0e0;
      --text2:  #6b7890;
      --text3:  #3d4560;
      --accent: #4af0a8;
      --acc2:   #00b8ff;
      --dlg:    #7c6af0;
      --idlg:   #4af0a8;
      --r:      6px;
      --mono:   'Space Mono', monospace;
      --ui:     'Syne', sans-serif;
    }

    :root.light-mode {
      --bg:     #f5ede6;
      --bg2:    #eae0d8;
      --bg3:    #ddd2ca;
      --border: #c9bfb7;
      --bord2:  #b8aaa0;
      --text:   #2c2420;
      --text2:  #6b6258;
      --text3:  #9d9088;
      --accent: #2d9d7d;
      --acc2:   #0078cc;
      --dlg:    #6b50d4;
      --idlg:   #2d9d7d;
    }

    html, body { height: 100%; }
    body { font-family: var(--ui); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bord2); border-radius: 3px; }

    a { color: var(--acc2); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px; min-width: 220px; background: var(--bg2);
      border-right: 1px solid var(--border); display: flex;
      flex-direction: column; position: sticky; top: 0; height: 100vh;
    }
    .sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
    .logo-mark { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
    .logo-sub  { font-size: 10px; color: var(--text3); text-transform: uppercase; margin-top: 2px; }

    .sidebar-nav { padding: 12px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 20px;
      font-size: 13px; font-weight: 600; color: var(--text2);
      text-decoration: none; transition: all .15s;
    }
    .nav-item:hover { color: var(--text); background: var(--bg3); text-decoration: none; }
    .nav-item.active { color: var(--accent); background: rgba(74,240,168,.07); border-right: 2px solid var(--accent); }
    .nav-icon { font-size: 15px; }

    .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text3); }
    .user-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--bord2); border-radius: 20px; padding: 4px 10px; margin-bottom: 10px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .logout-btn {
      display: block; text-align: center; padding: 6px; border: 1px solid var(--bord2);
      border-radius: var(--r); color: var(--text3); font-size: 11px; cursor: pointer;
      background: none; width: 100%; font-family: var(--mono); transition: all .15s;
    }
    .logout-btn:hover { border-color: #f05a5a; color: #f05a5a; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { border-bottom: 1px solid var(--border); padding: 16px 32px; background: var(--bg2); }
    .top-bar-header { display: flex; justify-content: space-between; align-items: center; }
    .top-bar h1 { font-size: 18px; font-weight: 700; }
    .top-bar .bc { font-size: 12px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }
    .page-body { padding: 32px; overflow-y: auto; flex: 1; }

    /* ── Cards ── */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .card-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 11px;
      font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text2);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-body { padding: 20px; }

    /* ── Stats ── */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text3); margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 800; font-family: var(--mono); line-height: 1; }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }

    /* ── Table ── */
    .run-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .run-table th { text-align: left; padding: 10px 16px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); }
    .run-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .run-table tr:last-child td { border-bottom: none; }
    .run-table tr:hover td { background: var(--bg3); }
    .run-table a { color: var(--text); font-weight: 600; }
    .run-table a:hover { color: var(--accent); text-decoration: none; }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-family: var(--mono); background: rgba(208,216,230,.08); color: var(--text2); border: 1px solid var(--bord2); }
    .mp { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; font-family: var(--mono); }
    .mp-dlg  { background: rgba(124,106,240,.12); color: var(--dlg); }
    .mp-idlg { background: rgba(74,240,168,.10); color: var(--idlg); }

    /* ── Metrics ── */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    @media (max-width: 900px) { .metrics-grid { grid-template-columns: 1fr; } }

    /* ── Images ── */
    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .img-item { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; }
    .img-item:hover { border-color: var(--acc2); transform: translateY(-2px); }
    .img-item img { width: 100%; display: block; }
    .img-label { padding: 8px 10px; font-size: 11px; font-family: var(--mono); color: var(--text2); }

    /* ── Log viewer ── */
    .log-viewer { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; font-family: var(--mono); font-size: 12px; color: var(--text2); max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }

    /* ── Meta table ── */
    .meta-table { width: 100%; font-size: 13px; }
    .meta-table td { padding: 7px 0; border-bottom: 1px solid var(--border); }
    .meta-table tr:last-child td { border-bottom: none; }
    .meta-table td:first-child { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; width: 160px; padding-right: 16px; }
    .meta-table td:last-child { font-family: var(--mono); color: var(--text); }

    /* ── File list ── */
    .file-list { list-style: none; }
    .file-list li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .file-list li:last-child { border-bottom: none; }
    .fname { font-family: var(--mono); color: var(--text); }
    .fmeta { font-size: 11px; color: var(--text3); font-family: var(--mono); }
    .dl-btn { padding: 4px 12px; font-size: 11px; background: var(--bg3); border: 1px solid var(--bord2); border-radius: var(--r); color: var(--acc2); font-family: var(--mono); }
    .dl-btn:hover { border-color: var(--acc2); text-decoration: none; }

    /* ── Theme toggle ── */
    .theme-toggle { padding: 6px 12px; font-size: 16px; background: none; border: 1px solid var(--bord2); border-radius: var(--r); color: var(--text2); cursor: pointer; transition: all .15s; }
    .theme-toggle:hover { color: var(--text); border-color: var(--text2); }

    /* ── Tabs ── */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    .tab-btn { padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--text2); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; font-family: var(--ui); }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Section title ── */
    .sec { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .sec::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Code block ── */
    .code-block { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; font-family: var(--mono); font-size: 12px; color: var(--accent); margin-top: 10px; overflow-x: auto; white-space: pre; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .4; }

    /* ── API endpoint ── */
    .ep-method { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; font-family: var(--mono); margin-right: 8px; }
    .m-post { background: rgba(74,240,168,.15); color: var(--accent); }
    .m-get  { background: rgba(0,184,255,.15);  color: var(--acc2); }
    .ep-path { font-family: var(--mono); font-size: 13px; color: var(--text); }
    .ep-desc { font-size: 13px; color: var(--text2); margin-top: 6px; }

    /* ── Lightbox ── */
    .lb-ov { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.9); align-items: center; justify-content: center; cursor: zoom-out; }
    .lb-ov.open { display: flex; }
    .lb-ov img { max-width: 95vw; max-height: 92vh; border-radius: 4px; cursor: default; }
    .lb-close { position: absolute; top: 20px; right: 28px; font-size: 28px; color: var(--text2); cursor: pointer; }
    .lb-close:hover { color: var(--text); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn .3s ease both; }
  </style>
  <script>
    // Apply saved theme immediately (before page renders to avoid flash)
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">◈ GradInv</div>
      <div class="logo-sub">Experiment Dashboard</div>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if active_nav == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">◉</span> Dashboard
      </a>
      <a href="/jobs" class="nav-item {% if active_nav == 'jobs' %}active{% endif %}">
        <span class="nav-icon">⊞</span> Experiments
      </a>
      <a href="/api-docs" class="nav-item {% if active_nav == 'api' %}active{% endif %}">
        <span class="nav-icon">⌥</span> API Docs
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-pill"><div class="dot"></div>{{ username }}</div>
      <form action="/logout" method="post">
        <button class="logout-btn" type="submit">Sign out</button>
      </form>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <div class="top-bar">
      <div class="top-bar-header">
        <div>
          <h1>{% block page_title %}{% endblock %}</h1>
          {% if breadcrumb %}<div class="bc">{{ breadcrumb }}</div>{% endif %}
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
      </div>
    </div>
    <div class="page-body fade-in">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lb-ov" id="lb" onclick="closeLb()">
  <div class="lb-close" onclick="closeLb()">✕</div>
  <img src="" alt="" onclick="event.stopPropagation()">
</div>

<script>
  function switchTab(g, id) {
    document.querySelectorAll('[data-tg="' + g + '"]').forEach(e => e.classList.toggle('active', e.dataset.t === id));
    document.querySelectorAll('[data-pg="' + g + '"]').forEach(e => e.classList.toggle('active', e.dataset.p === id));
  }
  function openLb(src) { const lb = document.getElementById('lb'); lb.querySelector('img').src = src; lb.classList.add('open'); }
  function closeLb()   { document.getElementById('lb').classList.remove('open'); }
  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.getElementById('theme-btn');
    const isLight = html.classList.toggle('light-mode');
    const theme = isLight ? 'light' : 'dark';
    localStorage.setItem('theme', theme);
    btn.textContent = isLight ? '☀️' : '🌙';
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
